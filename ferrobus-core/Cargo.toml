[package]
name = "ferrobus_core"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
thiserror = "2.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
csv = "1"
postcard = { version = "1.1", default-features = false, features = [
    "use-std",
] }
chrono.workspace = true
rstar = { version = "0.12", features = ["serde"] }
petgraph = { version = "0.8", features = ["serde-1"] }
hashbrown = { version = "0.16.0", features = ["serde"] }
fixedbitset = "0.5"
h3o = { version = "0.9.0", features = ["geo", "serde"] }
osm4routing = { git = "https://github.com/frehoy/osm4routing2.git", rev = "9952de86396571f338d77d967edd0ab3cd6bf213" }
geo.workspace = true
geojson.workspace = true
rayon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
dotenvy = "0.15"
libc = "0.2"
wkt = "0.14.0"
# Reading raw OSM tags, for the memprobe example only.
osmpbf = "0.3"

[[bench]]
name = "bench_main"
harness = false
